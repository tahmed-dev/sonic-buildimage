  neighbor fc00::2 timers 3 10
  neighbor fc00::2 timers connect 10
  address-family ipv6
    neighbor fc00::2 peer-group PEER_V6
    neighbor fc00::2 activate
  exit-address-family
!
!
!
  address-family ipv4
